[project]
name = "sudokusolver"
version = "0.1.0"
description = "REST API for the SudokuArena web app (Django + DRF)."
authors = [
    {name = "Raphael Landure", email = "raph.landure@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django (==6.0.7)",
    "djangorestframework (==3.17.1)",
    "drf-spectacular (==0.30.0)",
    "django-cors-headers (==4.9.0)",
    "djangorestframework-simplejwt (==5.5.1)",
    "django-environ (==0.14.0)",
    "django-allauth (==65.18.0)",
    "dj-rest-auth (==7.2.0)",
    "cryptography (==49.0.0)",
    "sudoku-resolver @ git+https://github.com/raphaellndr/sudoku-resolver.git",
    "celery (==5.6.3)",
    "requests (==2.34.2)",
    "redis (==8.0.1)",
    "channels-redis (==4.3.0)",
    "asgiref (==3.11.1)",
    "channels[daphne] (==4.3.2)",
    "psycopg2 (==2.9.12)",
    "onnxruntime (==1.27.0)",
    "opencv-python-headless (==5.0.0.93)",
]

[project.optional-dependencies]
production = [
    "django-redis (==5.4.0)",
]

[dependency-groups]
dev = [
    # Linting and formatting
    "ruff (==0.15.21)",
    "mypy (==2.2.0)",
    "pre-commit (==4.6.0)",
    "django-stubs (==6.0.6)",
    "djangorestframework-stubs (==3.17.0)",
    # Testing
    "pytest (==9.1.1)",
    "pytest-django (==4.11.1)",
    "pytest-asyncio (==1.4.0)",
    "pytest-cov (==7.1.0)",
    "factory-boy (==3.3.3)",
]

[tool.poetry]
# Application (not a distributable package): skip installing the project itself as a package.
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
# See https://github.com/typeddjango/django-stubs
allow_redefinition = true
check_untyped_defs = true
ignore_missing_imports = false
incremental = true
strict_optional = true
show_traceback = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disable_error_code = ["empty-body"]
force_uppercase_builtins = true
force_union_syntax = true
enable_error_code = ["deprecated"]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
mypy_path = "./app"

[tool.django-stubs]
django_settings_module = "config.settings.local"
ignore_missing_model_attributes = true

[[tool.mypy.overrides]]
module = ["*.migrations.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["rest_framework.*", "environ.*", "dj_rest_auth.*", "allauth.*"]
follow_untyped_imports = true

[tool.ruff]
# See: https://github.com/cookiecutter/cookiecutter-django
line-length = 100
indent-width = 4
target-version = "py312"
extend-exclude = ["*/migrations/*.py"]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # isort
    "I",
    # Pylint
    "PL",
    # pydocstyle
    "D",
    # flake8-print
    "T20"
]
ignore = [
    # Disable rule `D401` (`non-imperative-mood`)
    "D401",
    # Disable rule `D213` (`multi-line-summary-second-line`)
    "D213",
    # Disable rule `D203` (`incorrect-blank-line-before-class`)
    "D203",
    # Disable rule `D107` (`undocumented-public-init`)
    "D107",
    # Disable rule `D200` (`unnecessary-multiline-docstring`)
    "D200"
]

[tool.ruff.lint.flake8-pytest-style]
parametrize-names-type = "csv"

[tool.pytest.ini_options]
pythonpath = ["app"]
python_files = ["tests.py", "test_*.py"]
DJANGO_SETTINGS_MODULE = "config.settings.local"
testpaths = ["tests"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    # Have to re-enable the standard pragma
    "pragma: no cover",
    # Don't complain about missing debug-only code:
    "def __repr__",
    "if self.debug",
    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",
    # Don't complain if non-runnable code isn't run:
    "if 0:",
    "if __name__ == .__main__.:",
    # Don't complain if '__all__' statements are not hit
    '__all__ = \[[\s\S]*\]',
    # Don't complain if 'TYPE_CHECKING' conditions are not hit
    'if TYPE_CHECKING:',
]
fail_under = 90

[tool.coverage.run]
source = ["app"]
